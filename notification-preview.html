<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notification component preview</title><script src="theme.js"></script><link rel="stylesheet" href="material3.css"><link rel="stylesheet" href="m3-site.css"><style>body{margin:0;padding:24px;font-family:Roboto,Arial,sans-serif;background:var(--md-sys-color-background,#f5f6f8);color:var(--md-sys-color-on-background,#242934)}main{max-width:880px;margin:auto}h1{font-size:28px}h2{font-size:20px;margin-top:32px}.alerts{display:grid;gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}footer{margin:32px 0 120px;line-height:1.5}</style><main><h1>Notifications</h1><p>Shared component preview · not the public website</p><h2>Flat alerts</h2><div class="alerts"><cathedral-notice kind="info" heading="Information" message="This collection is being expanded." dismissible></cathedral-notice><cathedral-notice kind="error" heading="Unable to save" message="Please try again." dismissible></cathedral-notice><cathedral-notice kind="success" heading="Saved" message="Your test plan has been saved." dismissible></cathedral-notice><cathedral-notice kind="warning" heading="Under construction" message="This website is still being built. Some features may not work, pages may be incomplete, and parts of the design are still being refined." dismissible></cathedral-notice></div><h2>Floating card anatomy</h2><div class="cards"><cathedral-notice kind="warning" presentation="card" heading="Under construction" action-label="Continue exploring" message="You’re welcome to explore while construction continues." dismissible></cathedral-notice><cathedral-notice kind="error" presentation="card" heading="Unable to save" message="Please try again." action-label="Dismiss" dismissible></cathedral-notice></div><h2>Persistent label</h2><cathedral-notice kind="warning" presentation="label" action-label="Continue exploring" heading="Under construction" message="This website is still being built. Some features may not work, pages may be incomplete, and parts of the design are still being refined. You’re welcome to explore while construction continues."></cathedral-notice><footer>Select the label to open the explanation. Close an alert or card using its close control.</footer></main><script src="cathedral-notice.js"></script></html>
